name: Fork release

# Release main as oliviacpu-YYYY.MM.DD[.N] with the npm package attached. Run by fork-sync.yml after
# an upstream merge, or by hand after merging a fork change. See FORK.md.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: bash .github/fork/release.sh
